spring:
  application:
    name: ignite-server
    version: ${APP_VERSION:0.0.1}
    project-name: datafirewall

ignite:
  instance-name: ignite-server-a
  consistent-id: ignite-server-a
  local-host: 127.0.0.1

  cluster:
    activate-on-start: true

  discovery:
    addresses:
      - 127.0.0.1:47500..47520
    local-port: 47500
    local-port-range: 20

  communication:
    local-port: 47100
    local-port-range: 20

  thin-client:
    host: 127.0.0.1
    port: 10800
    port-range: 100

  ssl:
    enabled: false
    client-auth: false
    key-store-path:
    key-store-password:
    trust-store-path:
    trust-store-password:

  authentication:
    enabled: true

  persistence:
    enabled: true
    storage-path: ./ignite/data/storage
    wal-path: ./ignite/data/wal
    wal-archive-path: ./ignite/data/wal-archive

  data-region:
    name: Default_Region
    initial-size-mb: 256
    max-size-mb: 512

